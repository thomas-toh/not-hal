# Selfcheck CI: every module's offline logic check, on every push. The replay harness can't
# run here because the voice WAVs are deliberately untracked. No models, no API key, no audio
# device needed.
name: checks

on:
  push:
  pull_request:

jobs:
  selfchecks:
    runs-on: windows-latest # the reference platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m shared.config
      - run: python -m shared.log
      # The config file + the settings schema it derives its defaults from. Points at
      # a temp file, so it never touches a real profile.
      - run: python -m shared.settings
      - run: python -m backend.audio.wake --selfcheck
      - run: python -m backend.audio.listen --selfcheck
      - run: python -m backend.audio.speak --selfcheck
      # Contract B core: the `transform` verb's plumbing over converse (no network). Run via -c,
      # not -m: the package __init__ already imports base, so -m re-executes it with a warning.
      - run: python -c "from backend.llm import base; base._selfcheck()"
      - run: python -m backend.llm.claude --selfcheck
      # The provider catalogue: base-URL composition and the credential/env fallback, both
      # read from shared/schemas/settings.json. Touches the network only to prove a dead endpoint
      # returns [] instead of raising.
      - run: python -m backend.llm.providers
      # B2: the one OpenAI-compatible adapter behind ten providers. Offline — request
      # shaping, tool translation, error mapping, client lifetime. No key, no network.
      - run: python -m backend.llm.compat --selfcheck
      # The router: resolve a role -> the configured provider/model from
      # settings, or None to let the caller default. No network — this is what makes the model
      # picker actually drive the daemon.
      - run: python -m backend.router
      - run: python -m backend.orchestrator --selfcheck
      - run: python -m backend.broadcaster --selfcheck
      # The lifetime tie: a CLEAN exit of either process stops the other (tray Quit, Ctrl-C);
      # a CRASH of either spares the survivor. Policy only — no subprocesses.
      - run: python run.py --selfcheck
      # Parsing + the tap/hold machine only; RegisterHotKey itself is proven live on a real machine.
      - run: python -m backend.hotkeys --selfcheck
      # Dictation delivery: the UTF-16 encoder + a clipboard round-trip when the session
      # has one (skipped, not failed, in a headless runner); the Ctrl+V chord is proven live.
      - run: python -m backend.paste --selfcheck
      # Word-replacement: the whole-word, case-insensitive, literal find-and-replace
      # run before dictation cleanup, plus that the shipped table loads. No network.
      - run: python -m backend.replace
      # Contract T, the tool executor. Checks the filter (only implemented, in-tier tools
      # reach the model), dispatch, the refusal backstop, and that every call is audited to
      # logs/audit.jsonl. No network; degrades gracefully with no clipboard on a headless runner.
      # find_document and search_email included: the shared term sanitiser and the DASL builder
      # (their SQL/DASL trust boundaries) are checked directly, and each call must answer in prose
      # whether or not the runner has a Search index or an Outlook mail profile — neither is
      # required here. The Tier-2 tools ACT, so their backends are stubbed for dispatch and the
      # part with a decision in it — resolving a spoken name to an app or a window — is checked
      # directly instead: nothing here opens an app, moves a window or presses a key.
      - run: python -m backend.tools --selfcheck
      # The Teleprompter's Qt-free half: NDJSON framing + the reducer (imports no Qt).
      - run: python -m frontend.decode --selfcheck
      # The renderer itself. PySide6 is a CORE dependency, so `pip install -e .` above
      # already installed it; overlay_check runs headless on Qt's offscreen platform (it sets
      # QT_QPA_PLATFORM itself), so no display is needed. This is the check guarding the module
      # where every renderer bug this cycle lived. Software RHI: no GPU on the runner.
      - run: python -m frontend.overlay_check
        env:
          QSG_RHI_BACKEND: software
      # The settings window's model — add/remove/enable/primary bookkeeping, no QML needed.
      - run: python -m frontend.settings_model
      # The Al mascot renderer: the v2 kit loads, both palettes come from the JSON,
      # the kit's script drives the player (enters resolve, holds freeze, idle fidgets), the app
      # icon builds and image://al tolerates a bad id. Offscreen (the module sets it itself).
      - run: python -m frontend.al
      # The tray's mic ring: the level→picture mapping and the repaint gate that keeps a steady
      # voice from calling setIcon once per mic frame.
      - run: python -m frontend.tray
      # ...and the window itself, driven through every state it has. QML binding errors
      # are only warnings at runtime, so this fails on any of them. Headless, same as above.
      - run: python -m frontend.settings_check
        env:
          QSG_RHI_BACKEND: software
