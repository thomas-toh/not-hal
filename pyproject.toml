[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "not-hal"
version = "0.0.0"
description = "The not-hal daemon: audio pipeline, orchestrator, and swappable LLM llm for a UI-first desk voice assistant. See spec/ and docs/04."
requires-python = ">=3.12"
# ponytail: only what the code imports today. TTS deps land when step 4 (docs/04
# §8) needs them, not speculatively.
dependencies = [
    "anthropic",
    # B2 (spec/20, D30): ONE OpenAI-compatible adapter serves the other ten providers — Groq,
    # OpenAI, xAI, DeepSeek, Mistral, OpenRouter, Google's compat layer, and Ollama / LM Studio /
    # llama.cpp locally. The SDK is pointed at each provider's base_url. Taken rather than
    # hand-rolled because it carries SSE streaming and the reassembly of fragmented tool-call
    # arguments — the two places a hand-written client would quietly get it wrong.
    "openai",
    "keyring",
    # step 2 (docs/04 §8): mic capture + wake word. onnxruntime is explicit because
    # we run openWakeWord on ONNX (Windows + macOS both, spec/00 D10), not tflite.
    "sounddevice",
    "openwakeword",
    "onnxruntime",
    # step 3: STT. VAD needs no new dep -- we run the Silero VAD ONNX model that
    # openWakeWord already ships, via onnxruntime (no torch; see backend/audio/listen.py).
    "faster-whisper",
    # step 4: TTS out. Kokoro on onnxruntime (no torch); espeakng-loader (pulled in)
    # bundles the espeak-ng phonemiser, so no manual install. Earcons need no dep.
    "kokoro-onnx",
    # The Teleprompter (component P). NOT optional: D23 makes the UI the spine — it always
    # carries the answer, and D20's propose-then-tap has nowhere to render without it.
    # Needs Windows Long Paths enabled; Qt's QML module trees nest past 260 chars and the
    # install otherwise HALF-COMPLETES SILENTLY (import works, QtQuick is missing). See
    # frontend/__main__.py, which checks for that at startup and says so loudly.
    "PySide6",
]

[project.optional-dependencies]
# GPU speech-to-text on an NVIDIA host (Windows/Linux): ~28x faster than CPU (STATE).
# Install with:  pip install -e ".[gpu-cuda]"  -- listen.py then adds these DLLs to the
# search path automatically. Not for macOS (use the CPU path / a future Metal engine).
gpu-cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12", "nvidia-cuda-runtime-cu12"]

[tool.setuptools]
packages = ["backend", "frontend", "shared"]

# The QML, its qmldir, the bundled font, and the peek action icons are loaded from disk relative
# to the package, so a non-editable install has to carry them too. `qmldir` has no extension, so
# the *.qml glob misses it — without it, `import frontend` (the Theme singleton) dies with
# "module not installed" off an editable install. CI's `pip install -e .` masks it, so name each
# explicitly (D27 added icons/, PeekPanel.qml is covered by *.qml).
# `fonts/*.txt` + `fonts/*.md` are the font licences, not documentation: OFL 1.1 and Apache 2.0
# both require the licence to travel with the font, so a wheel that carried the .ttf without them
# would be the distribution that breaches. See frontend/fonts/ATTRIBUTION.md.
[tool.setuptools.package-data]
frontend = ["*.qml", "qmldir", "fonts/*.ttf", "fonts/*.txt", "fonts/*.md", "icons/*.svg"]
shared = ["schemas/*.json"]
